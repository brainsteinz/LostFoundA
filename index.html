<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Thing(s) In Our Campus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Find Your Thing(s) In Our Campus</h1>
    <p>Platform Pelaporan & Pencarian Barang Hilang / Ditemukan</p>
  </header>

  <main class="container">
    <!-- Form Tambah Laporan -->
    <section class="card">
      <h2>Buat Laporan Baru</h2>
      <form id="reportForm">
        <div class="form-group">
          <input type="text" id="title" placeholder="Nama Barang (contoh: Dompet Hitam)" required>
          
          <select id="category" required>
            <option value="" disabled selected>Pilih Kategori Barang</option>
            <option value="Elektronik">Elektronik</option>
            <option value="Berkas / Dokumen">Berkas / Dokumen</option>
            <option value="Pakaian / Aksesoris">Pakaian / Aksesoris</option>
            <option value="Kunci">Kunci</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <select id="type" required>
            <option value="Lost">Hilang (Lost)</option>
            <option value="Found">Ditemukan (Found)</option>
          </select>
          
          <input type="date" id="date" required>
        </div>

        <input type="text" id="location" placeholder="Lokasi Kejadian (contoh: Perpustakaan Lt. 2)" required>
        
        <!-- Input Kontak & Kategori Kontak -->
        <div class="form-group">
          <select id="contactPlatform" required>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Instagram">Instagram</option>
            <option value="TikTok">TikTok</option>
            <option value="Line">Line</option>
            <option value="Lainnya">Lainnya</option>
          </select>
          <input type="text" id="contactDetail" placeholder="Nomor / Username Kontak" required>
        </div>

        <textarea id="description" placeholder="Deskripsi rinci barang..." rows="3" required></textarea>

        <button type="submit" id="btnSubmit">Kirim Laporan</button>
      </form>
    </section>

    <!-- Filter Pencarian -->
    <section class="search-section">
      <input type="text" id="searchInput" placeholder="Cari barang berdasarkan nama, kategori, atau lokasi...">
    </section>

    <!-- Tampilan 3 Kolom Utama -->
    <section class="dashboard-grid">
      <!-- Kolom Barang Hilang -->
      <div class="column col-lost">
        <div class="column-header">
          <h3>Barang Hilang</h3>
        </div>
        <div id="lostList" class="column-content"></div>
      </div>

      <!-- Kolom Barang Ditemukan -->
      <div class="column col-found">
        <div class="column-header">
          <h3>Barang Ditemukan</h3>
        </div>
        <div id="foundList" class="column-content"></div>
      </div>

      <!-- Kolom Selesai -->
      <div class="column col-completed">
        <div class="column-header">
          <h3>Selesai</h3>
        </div>
        <div id="completedList" class="column-content"></div>
      </div>
    </section>
  </main>

  <!-- SDK Firebase Versi Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
